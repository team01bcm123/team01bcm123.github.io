<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔫 P2P 联机枪战 · 无需服务器</title>
    <!-- 使用 PeerJS 实现 P2P 连接 -->
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            margin: 0;
            min-height: 100vh;
            background: #0e1e2b;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
        }
        .container {
            background: #1f4055;
            padding: 18px 22px 22px;
            border-radius: 40px;
            border: 1px solid #3d7a94;
            box-shadow: 0 20px 30px rgba(0,0,0,0.7);
        }
        canvas {
            display: block;
            background: #1f3f4f;
            border-radius: 24px;
            box-shadow: inset 0 0 0 2px #4d8ba8;
            width: 800px;
            height: 600px;
            cursor: crosshair;
        }
        .panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            color: #d4edff;
            flex-wrap: wrap;
            gap: 8px;
        }
        .status {
            background: #102b38;
            padding: 4px 16px;
            border-radius: 40px;
            border: 1px solid #2f6279;
            font-size: 0.85rem;
        }
        .status .online { color: #6fcf97; }
        .status .offline { color: #eb5757; }
        .btn {
            background: #4f8aa8;
            border: none;
            color: white;
            font-weight: 700;
            padding: 5px 16px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.15s;
            border: 1px solid #8bc9e6;
        }
        .btn:hover { background: #5f9ab8; }
        .btn.danger { background: #c74e3c; border-color: #e6836e; }
        .btn.danger:hover { background: #d85e4c; }
        .btn.success { background: #27ae60; border-color: #6fcf97; }
        .btn.success:hover { background: #2ecc71; }
        .input-group {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .input-group input {
            background: #0e2a38;
            border: 1px solid #2f6279;
            border-radius: 30px;
            padding: 4px 12px;
            color: #d4edff;
            width: 100px;
            font-size: 0.85rem;
        }
        .input-group input:focus { outline: none; border-color: #4d8ba8; }
        .hint {
            color: #9ec3d6;
            font-size: 0.75rem;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 6px;
        }
        .hint span { background: #13303f; padding: 2px 10px; border-radius: 30px; border: 1px solid #2b6279; }
        .player-list {
            font-size: 0.8rem;
            color: #b3def5;
            background: #102b38;
            padding: 2px 14px;
            border-radius: 30px;
            border: 1px solid #2f6279;
        }
        @media (max-width: 860px) {
            canvas { width: 100%; height: auto; aspect-ratio: 4/3; }
            .container { padding: 10px; }
            .panel { flex-direction: column; align-items: stretch; }
            .input-group { justify-content: center; }
        }
    </style>
</head>
<body>
<div class="container">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div class="panel">
        <div class="status" id="statusDisplay">🔴 <span class="offline">未连接</span></div>
        <div class="input-group">
            <input type="text" id="peerIdInput" placeholder="对方ID" value="">
            <button class="btn success" id="connectBtn">📞 连接</button>
            <button class="btn" id="createBtn">🎯 创建房间</button>
        </div>
        <div class="player-list" id="playerList">👥 0 人</div>
    </div>
    <div class="hint">
        <span>🖱️ 鼠标瞄准 · 左键射击</span>
        <span>WASD 移动</span>
        <span>💡 双方都需打开此页面</span>
    </div>
</div>

<script>
    // ============================================================
    //  🚀 P2P 联机枪战 (PeerJS)
    //  无需服务器，点对点直连
    // ============================================================

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const statusDisplay = document.getElementById('statusDisplay');
    const playerList = document.getElementById('playerList');

    // ----- 游戏状态 -----
    let players = {};           // { id: { x, y, angle, hp, alive, name, color } }
    let bullets = [];
    let obstacles = [];
    let myId = null;
    let peer = null;
    let connections = {};       // { peerId: DataConnection }
    let gameRunning = true;
    let winnerId = null;
    let isHost = false;
    let localPlayer = null;

    const COLORS = ['#f2c94c', '#eb5757', '#2f9bff', '#6fcf97', '#bb6bd9', '#f2994a', '#27ae60', '#e74c3c'];
    const NAMES = ['🟡 黄', '🔴 红', '🔵 蓝', '🟢 绿', '🟣 紫', '🟠 橙', '🟢 翠', '🔴 赤'];

    // 鼠标状态
    let mouseX = 400, mouseY = 300;
    let mousePressed = false;
    let shootCooldown = 0;

    // 键盘
    const keys = {};

    // ----- 初始化障碍物 -----
    function initObstacles() {
        return [
            { id: 'o1', x: 350, y: 200, w: 80, h: 30, hp: 3, maxHp: 3, alive: true },
            { id: 'o2', x: 400, y: 350, w: 80, h: 30, hp: 3, maxHp: 3, alive: true },
            { id: 'o3', x: 200, y: 420, w: 30, h: 80, hp: 3, maxHp: 3, alive: true },
            { id: 'o4', x: 580, y: 120, w: 30, h: 80, hp: 3, maxHp: 3, alive: true },
            { id: 'o5', x: 120, y: 260, w: 30, h: 80, hp: 3, maxHp: 3, alive: true },
            { id: 'o6', x: 650, y: 400, w: 30, h: 80, hp: 3, maxHp: 3, alive: true },
        ];
    }
    obstacles = initObstacles();

    // ----- 创建玩家 -----
    function createPlayer(id, x, y) {
        return {
            id: id,
            x: x, y: y,
            angle: 0,
            hp: 3,
            maxHp: 3,
            alive: true,
            color: COLORS[id % COLORS.length],
            name: NAMES[id % NAMES.length] || `玩家${id}`,
            radius: 16,
            speed: 3.0,
            shootCooldown: 0
        };
    }

    // ----- 生成出生点 -----
    function getSpawn(id) {
        const spawns = [
            { x: 150, y: 150 }, { x: 650, y: 150 },
            { x: 150, y: 450 }, { x: 650, y: 450 },
            { x: 400, y: 80 }, { x: 400, y: 520 },
            { x: 80, y: 300 }, { x: 720, y: 300 }
        ];
        return spawns[id % spawns.length];
    }

    // ----- 初始化本地玩家 -----
    function initLocalPlayer(id) {
        const spawn = getSpawn(id);
        localPlayer = createPlayer(id, spawn.x, spawn.y);
        players[id] = localPlayer;
        myId = id;
    }

    // ----- 广播消息到所有连接 -----
    function broadcast(data) {
        const msg = JSON.stringify(data);
        for (let conn of Object.values(connections)) {
            if (conn.open) {
                conn.send(msg);
            }
        }
    }

    // ----- 发送给特定玩家 -----
    function sendTo(peerId, data) {
        const conn = connections[peerId];
        if (conn && conn.open) {
            conn.send(JSON.stringify(data));
        }
    }

    // ----- 处理收到的消息 -----
    function handleMessage(data, senderId) {
        switch (data.type) {
            case 'state':
                // 完整状态同步 (主机发给客户端)
                players = data.players || {};
                bullets = data.bullets || [];
                obstacles = data.obstacles || [];
                gameRunning = data.gameRunning !== undefined ? data.gameRunning : true;
                winnerId = data.winnerId || null;
                // 保留自己的玩家对象
                if (myId && players[myId]) {
                    localPlayer = players[myId];
                }
                break;

            case 'player_joined':
                players[data.id] = data.player;
                break;

            case 'player_left':
                delete players[data.id];
                break;

            case 'player_update':
                if (players[data.id]) {
                    Object.assign(players[data.id], data.player);
                }
                break;

            case 'bullet_spawn':
                bullets.push(data.bullet);
                break;

            case 'bullet_remove':
                bullets = bullets.filter(b => b.id !== data.bulletId);
                break;

            case 'obstacle_damage':
                for (let ob of obstacles) {
                    if (ob.id === data.obstacleId) {
                        ob.hp = data.hp;
                        if (ob.hp <= 0) ob.alive = false;
                        break;
                    }
                }
                break;

            case 'player_hit':
                if (players[data.targetId]) {
                    players[data.targetId].hp = data.hp;
                    if (data.hp <= 0) {
                        players[data.targetId].alive = false;
                    }
                }
                break;

            case 'game_over':
                gameRunning = false;
                winnerId = data.winnerId;
                break;

            case 'game_reset':
                players = data.players || {};
                bullets = [];
                gameRunning = true;
                winnerId = null;
                obstacles = data.obstacles || [];
                if (myId && players[myId]) {
                    localPlayer = players[myId];
                }
                break;

            case 'sync_request':
                // 客户端请求完整状态
                if (isHost) {
                    sendTo(senderId, {
                        type: 'state',
                        players: players,
                        bullets: bullets,
                        obstacles: obstacles,
                        gameRunning: gameRunning,
                        winnerId: winnerId
                    });
                }
                break;

            default:
                console.log('未知消息:', data.type);
        }
    }

    // ----- 创建房间 (主机) -----
    function createRoom() {
        if (peer) peer.destroy();
        peer = new Peer({
            debug: 2
        });

        peer.on('open', (id) => {
            myId = id;
            isHost = true;
            initLocalPlayer(0);
            obstacles = initObstacles();
            gameRunning = true;
            winnerId = null;
            bullets = [];
            statusDisplay.innerHTML = `🟢 <span class="online">主机 ${id}</span>`;
            updateUI();
            console.log('🎯 房间创建成功，ID:', id);
            document.getElementById('peerIdInput').value = id;
        });

        peer.on('connection', (conn) => {
            console.log('📞 新连接:', conn.peer);
            connections[conn.peer] = conn;
            conn.on('data', (data) => {
                try {
                    const msg = JSON.parse(data);
                    handleMessage(msg, conn.peer);
                    // 转发给其他客户端 (如果是主机)
                    if (isHost) {
                        // 检查是否是移动/射击消息，需要转发
                        if (msg.type === 'player_update' || msg.type === 'bullet_spawn') {
                            broadcast(data);
                        }
                    }
                } catch (e) {
                    console.warn('消息解析错误', e);
                }
            });
            conn.on('close', () => {
                delete connections[conn.peer];
                if (isHost) {
                    // 通知所有人有人离开
                    broadcast({ type: 'player_left', id: conn.peer });
                }
                updateUI();
            });

            // 如果是主机，发送当前状态给新客户端
            if (isHost) {
                // 先把新玩家加入
                const newPlayer = createPlayer(Object.keys(players).length, getSpawn(Object.keys(players).length));
                players[newPlayer.id] = newPlayer;
                broadcast({ type: 'player_joined', id: newPlayer.id, player: newPlayer });
                // 发送完整状态
                sendTo(conn.peer, {
                    type: 'state',
                    players: players,
                    bullets: bullets,
                    obstacles: obstacles,
                    gameRunning: gameRunning,
                    winnerId: winnerId
                });
                updateUI();
            }
        });

        peer.on('error', (err) => {
            console.error('Peer 错误:', err);
            statusDisplay.innerHTML = '🔴 <span class="offline">错误: ' + err.message + '</span>';
        });
    }

    // ----- 连接房间 (客户端) -----
    function joinRoom(hostId) {
        if (peer) peer.destroy();
        peer = new Peer({
            debug: 2
        });

        peer.on('open', (id) => {
            myId = id;
            isHost = false;
            initLocalPlayer(1); // 临时ID，等待主机分配
            statusDisplay.innerHTML = `🟡 <span class="online">连接中...</span>`;
            console.log('🔗 本地ID:', id);

            const conn = peer.connect(hostId);
            conn.on('open', () => {
                connections[hostId] = conn;
                statusDisplay.innerHTML = `🟢 <span class="online">已连接 ${hostId}</span>`;
                console.log('✅ 已连接到主机');
                // 请求同步
                sendTo(hostId, { type: 'sync_request' });
            });

            conn.on('data', (data) => {
                try {
                    const msg = JSON.parse(data);
                    handleMessage(msg, hostId);
                    // 更新本地玩家ID (如果主机分配了)
                    if (msg.type === 'state' && msg.players && myId) {
                        if (!msg.players[myId] && localPlayer) {
                            // 主机可能分配了新ID，寻找匹配
                            for (let id in msg.players) {
                                if (msg.players[id].name === localPlayer.name && !players[id]) {
                                    // 重新映射
                                    const oldId = myId;
                                    myId = id;
                                    players[id] = localPlayer;
                                    delete players[oldId];
                                    break;
                                }
                            }
                        }
                    }
                } catch (e) {
                    console.warn('消息解析错误', e);
                }
            });

            conn.on('close', () => {
                delete connections[hostId];
                statusDisplay.innerHTML = '🔴 <span class="offline">与主机断开</span>';
                console.log('❌ 与主机断开');
            });
        });

        peer.on('error', (err) => {
            console.error('Peer 错误:', err);
            statusDisplay.innerHTML = '🔴 <span class="offline">连接失败: ' + err.message + '</span>';
        });
    }

    // ----- 发送本地更新 -----
    function sendLocalUpdate() {
        if (!localPlayer || !myId) return;
        if (!localPlayer.alive) return;

        // 移动
        let dx = 0, dy = 0;
        if (keys['w'] || keys['arrowup']) dy -= 1;
        if (keys['s'] || keys['arrowdown']) dy += 1;
        if (keys['a'] || keys['arrowleft']) dx -= 1;
        if (keys['d'] || keys['arrowright']) dx += 1;

        const angle = Math.atan2(mouseY - localPlayer.y, mouseX - localPlayer.x);
        localPlayer.angle = angle;

        if (dx !== 0 || dy !== 0) {
            const len = Math.hypot(dx, dy);
            localPlayer.x += (dx / len) * localPlayer.speed;
            localPlayer.y += (dy / len) * localPlayer.speed;
            // 边界
            localPlayer.x = Math.max(localPlayer.radius, Math.min(800 - localPlayer.radius, localPlayer.x));
            localPlayer.y = Math.max(localPlayer.radius, Math.min(600 - localPlayer.radius, localPlayer.y));
        }

        // 障碍物碰撞
        for (let ob of obstacles) {
            if (!ob.alive) continue;
            const cx = localPlayer.x, cy = localPlayer.y, r = localPlayer.radius;
            const nearX = Math.max(ob.x, Math.min(cx, ob.x + ob.w));
            const nearY = Math.max(ob.y, Math.min(cy, ob.y + ob.h));
            const ddx = cx - nearX;
            const ddy = cy - nearY;
            if (ddx * ddx + ddy * ddy < r * r) {
                const ang = Math.atan2(ddy, ddx);
                const overlap = r - Math.hypot(ddx, ddy);
                localPlayer.x += Math.cos(ang) * overlap;
                localPlayer.y += Math.sin(ang) * overlap;
            }
        }

        // 射击冷却
        if (localPlayer.shootCooldown > 0) localPlayer.shootCooldown--;

        // 射击
        if (mousePressed && localPlayer.shootCooldown === 0 && localPlayer.alive) {
            const bullet = {
                id: Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                ownerId: myId,
                x: localPlayer.x + Math.cos(angle) * 20,
                y: localPlayer.y + Math.sin(angle) * 20,
                vx: Math.cos(angle) * 8,
                vy: Math.sin(angle) * 8,
                radius: 5,
                life: 70,
                damage: 1
            };
            bullets.push(bullet);
            localPlayer.shootCooldown = 14;
            // 广播子弹
            broadcast({ type: 'bullet_spawn', bullet: bullet });
            mousePressed = false; // 单次触发
        }

        // 广播玩家更新
        broadcast({
            type: 'player_update',
            id: myId,
            player: {
                x: localPlayer.x,
                y: localPlayer.y,
                angle: localPlayer.angle,
                hp: localPlayer.hp,
                alive: localPlayer.alive
            }
        });
    }

    // ----- 更新子弹 (主机) -----
    function updateBullets() {
        if (!isHost) return;

        for (let i = bullets.length - 1; i >= 0; i--) {
            const b = bullets[i];
            b.x += b.vx;
            b.y += b.vy;
            b.life--;

            if (b.x < 0 || b.x > 800 || b.y < 0 || b.y > 600 || b.life <= 0) {
                bullets.splice(i, 1);
                broadcast({ type: 'bullet_remove', bulletId: b.id });
                continue;
            }

            let used = false;
            // 障碍物碰撞
            for (let ob of obstacles) {
                if (!ob.alive) continue;
                if (b.x > ob.x && b.x < ob.x + ob.w && b.y > ob.y && b.y < ob.y + ob.h) {
                    ob.hp--;
                    if (ob.hp <= 0) ob.alive = false;
                    broadcast({ type: 'obstacle_damage', obstacleId: ob.id, hp: ob.hp });
                    used = true;
                    break;
                }
            }
            if (used) {
                bullets.splice(i, 1);
                broadcast({ type: 'bullet_remove', bulletId: b.id });
                continue;
            }

            // 玩家碰撞
            for (let p of Object.values(players)) {
                if (!p.alive || p.id === b.ownerId) continue;
                const dx = p.x - b.x;
                const dy = p.y - b.y;
                if (dx * dx + dy * dy < (p.radius + b.radius) * (p.radius + b.radius)) {
                    p.hp -= b.damage || 1;
                    if (p.hp <= 0) {
                        p.alive = false;
                        p.hp = 0;
                    }
                    broadcast({ type: 'player_hit', targetId: p.id, hp: p.hp });
                    used = true;
                    break;
                }
            }
            if (used) {
                bullets.splice(i, 1);
                broadcast({ type: 'bullet_remove', bulletId: b.id });
            }
        }

        // 检查游戏结束
        const alive = Object.values(players).filter(p => p.alive);
        if (alive.length <= 1 && gameRunning) {
            gameRunning = false;
            winnerId = alive.length === 1 ? alive[0].id : null;
            broadcast({ type: 'game_over', winnerId: winnerId });
        }
    }

    // ----- UI 更新 -----
    function updateUI() {
        const count = Object.keys(players).length;
        playerList.textContent = `👥 ${count} 人`;
        if (winnerId !== null && players[winnerId]) {
            document.getElementById('winnerDisplay')?.remove();
            // 不做额外处理
        }
    }

    // ----- 绘图 -----
    function draw() {
        ctx.clearRect(0, 0, 800, 600);

        // 背景
        ctx.strokeStyle = '#2a5468';
        ctx.lineWidth = 1;
        for (let i = 0; i < 800; i += 40) {
            ctx.beginPath();
            ctx.moveTo(i, 0);
            ctx.lineTo(i, 600);
            ctx.strokeStyle = '#26505f';
            ctx.stroke();
        }
        for (let i = 0; i < 600; i += 40) {
            ctx.beginPath();
            ctx.moveTo(0, i);
            ctx.lineTo(800, i);
            ctx.strokeStyle = '#26505f';
            ctx.stroke();
        }

        // 障碍物
        for (let ob of obstacles) {
            if (!ob.alive) continue;
            const alpha = 0.5 + 0.5 * (ob.hp / ob.maxHp);
            ctx.fillStyle = `rgba(90, 130, 150, ${alpha})`;
            ctx.shadowColor = '#aaccdd';
            ctx.shadowBlur = 8;
            ctx.fillRect(ob.x, ob.y, ob.w, ob.h);
            ctx.shadowBlur = 0;
            ctx.strokeStyle = '#b8d8e8';
            ctx.lineWidth = 2;
            ctx.strokeRect(ob.x, ob.y, ob.w, ob.h);
            if (ob.hp > 0) {
                ctx.fillStyle = '#c8e6f0';
                ctx.font = '10px monospace';
                ctx.fillText('🛡️'.repeat(ob.hp), ob.x + 4, ob.y + 14);
            }
        }

        // 子弹
        for (let b of bullets) {
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.radius || 5, 0, 2 * Math.PI);
            ctx.fillStyle = '#ffdd77';
            ctx.shadowColor = '#ffbb33';
            ctx.shadowBlur = 18;
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        // 玩家
        for (let id in players) {
            const p = players[id];
            if (!p.alive) {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 16, 0, 2 * Math.PI);
                ctx.fillStyle = '#334455';
                ctx.fill();
                ctx.fillStyle = '#667788';
                ctx.font = '20px sans-serif';
                ctx.fillText('💀', p.x - 14, p.y + 8);
                continue;
            }

            ctx.shadowColor = '#00000055';
            ctx.shadowBlur = 14;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 16, 0, 2 * Math.PI);
            ctx.fillStyle = p.color || COLORS[id % COLORS.length];
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2.5;
            ctx.stroke();

            ctx.shadowBlur = 0;
            const angle = p.angle || 0;
            const tipX = p.x + Math.cos(angle) * 26;
            const tipY = p.y + Math.sin(angle) * 26;
            ctx.beginPath();
            ctx.moveTo(p.x + Math.cos(angle) * 6, p.y + Math.sin(angle) * 6);
            ctx.lineTo(tipX, tipY);
            ctx.strokeStyle = '#1a1a2c';
            ctx.lineWidth = 5;
            ctx.stroke();
            ctx.strokeStyle = '#f0f0f0';
            ctx.lineWidth = 2.5;
            ctx.stroke();

            ctx.fillStyle = '#fff6d0';
            ctx.font = 'bold 15px monospace';
            ctx.shadowBlur = 8;
            ctx.shadowColor = '#000';
            ctx.fillText('❤️'.repeat(Math.max(0, p.hp)), p.x - 18, p.y - 30);
            ctx.fillStyle = '#e0f0ff';
            ctx.font = 'bold 12px sans-serif';
            ctx.fillText(p.name || `玩家${id}`, p.x - 20, p.y - 50);
            ctx.shadowBlur = 0;
        }

        // 鼠标准星
        if (localPlayer && localPlayer.alive) {
            ctx.beginPath();
            ctx.arc(mouseX, mouseY, 6, 0, 2 * Math.PI);
            ctx.fillStyle = '#ffdd88';
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#ffaa33';
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.moveTo(mouseX - 14, mouseY);
            ctx.lineTo(mouseX + 14, mouseY);
            ctx.moveTo(mouseX, mouseY - 14);
            ctx.lineTo(mouseX, mouseY + 14);
            ctx.strokeStyle = '#ffe066';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        // 游戏结束
        if (!gameRunning) {
            ctx.fillStyle = 'rgba(0,0,0,0.35)';
            ctx.fillRect(0, 0, 800, 600);
            ctx.font = 'bold 44px sans-serif';
            ctx.fillStyle = '#ffe484';
            ctx.shadowColor = '#000000';
            ctx.shadowBlur = 20;
            let msg = '💥 平局';
            if (winnerId !== null && players[winnerId]) {
                msg = `🏆 ${players[winnerId].name} 获胜！`;
            }
            ctx.fillText(msg, 200, 320);
            ctx.shadowBlur = 0;
        }

        updateUI();
    }

    // ----- 游戏循环 -----
    function gameLoop() {
        if (localPlayer && localPlayer.alive) {
            sendLocalUpdate();
        }

        if (isHost) {
            updateBullets();
        }

        draw();
        requestAnimationFrame(gameLoop);
    }

    // ----- 鼠标事件 -----
    canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        mouseX = Math.min(800, Math.max(0, (e.clientX - rect.left) * scaleX));
        mouseY = Math.min(600, Math.max(0, (e.clientY - rect.top) * scaleY));
    });

    canvas.addEventListener('mousedown', (e) => {
        if (e.button === 0) {
            e.preventDefault();
            mousePressed = true;
        }
    });

    canvas.addEventListener('mouseup', (e) => {
        if (e.button === 0) {
            e.preventDefault();
            // 不重置，让 sendLocalUpdate 处理
        }
    });

    canvas.addEventListener('contextmenu', (e) => e.preventDefault());

    // ----- 键盘 -----
    document.addEventListener('keydown', (e) => {
        const key = e.key.toLowerCase();
        keys[key] = true;
        if (['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright',' '].includes(key) || e.key === ' ') {
            e.preventDefault();
        }
    });

    document.addEventListener('keyup', (e) => {
        const key = e.key.toLowerCase();
        keys[key] = false;
        if (['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright',' '].includes(key) || e.key === ' ') {
            e.preventDefault();
        }
    });

    window.addEventListener('blur', () => {
        for (let k in keys) keys[k] = false;
        mousePressed = false;
    });

    // ----- 按钮 -----
    document.getElementById('createBtn').addEventListener('click', createRoom);
    document.getElementById('connectBtn').addEventListener('click', () => {
        const id = document.getElementById('peerIdInput').value.trim();
        if (id) {
            joinRoom(id);
        } else {
            alert('请输入对方的房间ID');
        }
    });

    // 页面关闭时清理
    window.addEventListener('beforeunload', () => {
        if (peer) peer.destroy();
    });

    // 启动
    console.log('🎮 P2P 联机枪战已启动');
    console.log('💡 一人点击"创建房间"，另一人输入ID后点击"连接"');

    // 添加胜者显示元素
    const panel = document.querySelector('.panel');
    const winnerEl = document.createElement('span');
    winnerEl.id = 'winnerDisplay';
    winnerEl.style.cssText = 'color:#f5d742;font-weight:bold;font-size:0.9rem;background:#102b38;padding:2px 14px;border-radius:30px;border:1px solid #2f6279;';
    winnerEl.textContent = '🏆 -';
    panel.appendChild(winnerEl);

    // 每帧更新胜者显示
    setInterval(() => {
        const el = document.getElementById('winnerDisplay');
        if (el) {
            if (!gameRunning && winnerId !== null && players[winnerId]) {
                el.textContent = `🏆 ${players[winnerId].name}`;
            } else if (!gameRunning) {
                el.textContent = '💥 平局';
            } else {
                el.textContent = '⚡ 进行中';
            }
        }
    }, 200);

    gameLoop();
</script>
</body>
</html>
