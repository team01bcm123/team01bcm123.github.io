<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔫 联机枪战</title>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js">
    </script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: #0a1a2a;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
            padding: 16px;
        }
        .container {
            background: #1a3a4a;
            padding: 18px 22px 22px;
            border-radius: 40px;
            border: 1px solid #3a7a94;
            box-shadow: 0 20px 30px rgba(0, 0, 0, 0.7);
            max-width: 880px;
            width: 100%;
        }
        canvas {
            display: block;
            background: #1a3a4a;
            border-radius: 24px;
            box-shadow: inset 0 0 0 2px #4a8ba8;
            width: 100%;
            height: auto;
            aspect-ratio: 800/600;
            cursor: crosshair;
        }
        .panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            color: #d4edff;
            flex-wrap: wrap;
            gap: 8px;
        }
        .status {
            background: #0a2a38;
            padding: 4px 16px;
            border-radius: 40px;
            border: 1px solid #2a6279;
            font-size: 0.8rem;
            font-weight: 600;
            min-width: 140px;
            text-align: center;
        }
        .status.online {
            color: #6fcf97;
        }
        .status.offline {
            color: #eb5757;
        }
        .status.connecting {
            color: #f2c94c;
        }
        .status.waiting {
            color: #8bc9e6;
        }
        .btn {
            border: none;
            color: white;
            font-weight: 700;
            padding: 5px 16px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: 0.15s;
        }
        .btn-host {
            background: #27ae60;
            border: 1px solid #6fcf97;
        }
        .btn-host:hover {
            background: #2ecc71;
        }
        .btn-join {
            background: #4f8aa8;
            border: 1px solid #8bc9e6;
        }
        .btn-join:hover {
            background: #5f9ab8;
        }
        .btn-danger {
            background: #c74e3c;
            border: 1px solid #e6836e;
        }
        .btn-danger:hover {
            background: #d85e4c;
        }
        .input-group {
            display: flex;
            gap: 6px;
            align-items: center;
            background: #0a2a38;
            padding: 2px 8px 2px 14px;
            border-radius: 40px;
            border: 1px solid #2a6279;
        }
        .input-group input {
            background: transparent;
            border: none;
            color: #d4edff;
            padding: 4px 0;
            width: 150px;
            font-size: 0.85rem;
            outline: none;
        }
        .input-group input::placeholder {
            color: #5a7a8a;
        }
        .stats {
            display: flex;
            gap: 14px;
            background: #0a2a38;
            padding: 4px 16px;
            border-radius: 60px;
            border: 1px solid #2a6279;
            font-size: 0.8rem;
        }
        .stats span {
            color: #b3def5;
        }
        .stats strong {
            color: #f5d742;
        }
        .hint {
            color: #9ec3d6;
            font-size: 0.7rem;
            display: flex;
            flex-wrap: wrap;
            gap: 4px 14px;
            margin-top: 8px;
            justify-content: center;
        }
        .hint span {
            background: #0a2a38;
            padding: 2px 10px;
            border-radius: 30px;
            border: 1px solid #2a6279;
        }
        .hint .p1 {
            color: #f2c94c;
        }
        .room-id {
            background: #0a2a38;
            padding: 4px 14px;
            border-radius: 30px;
            border: 1px solid #2a6279;
            font-size: 0.8rem;
            color: #f5d742;
            font-weight: bold;
            min-width: 100px;
            text-align: center;
        }
        .countdown {
            color: #ff6b6b;
            font-weight: bold;
            font-size: 1.2rem;
            background: #0a2a38;
            padding: 2px 14px;
            border-radius: 30px;
            border: 1px solid #ff6b6b;
        }
        .bullet-counter {
            color: #ffdd77;
            font-size: 0.7rem;
        }
        @media (max-width:600px) {
            .panel {
                flex-direction: column;
                align-items: stretch;
                gap: 6px;
            }
            .input-group {
                justify-content: center;
            }
            .stats {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div class="panel">
            <div class="status offline" id="statusDisplay">⚪ 未连接</div>
            <div class="input-group">
                <input type="text" id="roomInput" placeholder="输入房间号" value="">
                <button class="btn btn-join" id="joinBtn">📥 加入房间</button>
                <button class="btn btn-host" id="hostBtn">🚀 创建房间</button>
                <button class="btn btn-danger" id="disconnectBtn">⛔ 断开</button>
            </div>
            <div class="stats">
                <span>🏆 <strong id="winnerDisplay">-</strong></span>
                <span>👥 <strong id="playerCount">0</strong></span>
                <span class="bullet-counter">💥 <strong id="bulletCount">0</strong></span>
            </div>
        </div>
        <div style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:6px; margin-top:6px;">
            <div class="room-id" id="roomIdDisplay">📋 房间号: 无</div>
            <div class="hint">
                <span class="p1">🟡 WASD + 空格/左键</span>
                <span>❤️ 每人3条命</span>
                <span>🧱 掩体可破坏</span>
                <span class="countdown" id="countdownDisplay">⏳ 等待...</span>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        //  🌐 联机枪战 - 子弹显示最终修复版
        //  核心：本地子弹立即显示 + 网络同步
        // ============================================================

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const statusDisplay = document.getElementById('statusDisplay');
        const winnerSpan = document.getElementById('winnerDisplay');
        const playerCountEl = document.getElementById('playerCount');
        const bulletCountEl = document.getElementById('bulletCount');
        const roomIdDisplay = document.getElementById('roomIdDisplay');
        const countdownDisplay = document.getElementById('countdownDisplay');

        // ----- 游戏状态 -----
        let players = {};
        let localPlayer = null;
        let bullets = [];
        let obstacles = [];
        let gameRunning = true;
        let winnerId = null;
        let myId = null;
        let isHost = false;
        let isConnected = false;
        let resetTimer = null;
        let resetCountdown = 0;
        let gameEnded = false;

        // PeerJS
        let peer = null;
        let conn = null;
        let roomId = '';

        // ----- 玩家配置 -----
        const COLORS = ['#f2c94c', '#eb5757', '#2f9bff', '#6fcf97', '#bb6bd9', '#f2994a'];
        const SPAWNS = [
            { x: 150, y: 150 },
            { x: 650, y: 150 },
            { x: 150, y: 450 },
            { x: 650, y: 450 },
            { x: 400, y: 80 },
            { x: 400, y: 520 }
        ];

        const KEYMAP = [{ up: 'w', down: 's', left: 'a', right: 'd', fire: ' ' }];
        const keys = {};
        let mouseX = 400,
            mouseY = 300;
        let mousePressed = false;

        // ----- 工具函数 -----
        function genId() {
            return 'b' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
        }

        function createObstacles() {
            return [
                { id: 'o1', x: 350, y: 200, w: 80, h: 30, hp: 3, maxHp: 3, alive: true },
                { id: 'o2', x: 400, y: 350, w: 80, h: 30, hp: 3, maxHp: 3, alive: true },
                { id: 'o3', x: 200, y: 420, w: 30, h: 80, hp: 3, maxHp: 3, alive: true },
                { id: 'o4', x: 580, y: 120, w: 30, h: 80, hp: 3, maxHp: 3, alive: true },
                { id: 'o5', x: 120, y: 260, w: 30, h: 80, hp: 3, maxHp: 3, alive: true },
                { id: 'o6', x: 650, y: 400, w: 30, h: 80, hp: 3, maxHp: 3, alive: true },
            ];
        }

        function createPlayer(id, x, y, name, color) {
            return {
                id: id,
                x: x,
                y: y,
                radius: 16,
                speed: 3.2,
                hp: 3,
                maxHp: 3,
                alive: true,
                color: color || COLORS[Object.keys(players).length % COLORS.length],
                name: name || `玩家${Object.keys(players).length + 1}`,
                angle: 0,
                shootCooldown: 0
            };
        }

        function rectCircleCollide(rect, circle) {
            const nearX = Math.max(rect.x, Math.min(circle.x, rect.x + rect.w));
            const nearY = Math.max(rect.y, Math.min(circle.y, rect.y + rect.h));
            const dx = circle.x - nearX;
            const dy = circle.y - nearY;
            return (dx * dx + dy * dy) < (circle.radius * circle.radius);
        }

        // ============================================================
        //  游戏逻辑
        // ============================================================

        function initLocalGame() {
            const id = genId();
            myId = id;
            const spawn = SPAWNS[0];
            localPlayer = createPlayer(id, spawn.x, spawn.y, '我', COLORS[0]);
            players = {};
            players[id] = localPlayer;
            obstacles = createObstacles();
            bullets = [];
            gameRunning = true;
            gameEnded = false;
            winnerId = null;
            resetCountdown = 0;
            countdownDisplay.textContent = '⏳ 等待开始';
            countdownDisplay.style.color = '#8bc9e6';
            updateUI();
        }

        function resetGame() {
            console.log('🔄 重置游戏...');
            const playerList = Object.values(players);
            for (let i = 0; i < playerList.length; i++) {
                const p = playerList[i];
                const spawn = SPAWNS[i % SPAWNS.length];
                p.x = spawn.x;
                p.y = spawn.y;
                p.hp = 3;
                p.alive = true;
                p.angle = 0;
                p.shootCooldown = 0;
            }
            bullets = [];
            obstacles = createObstacles();
            gameRunning = true;
            gameEnded = false;
            winnerId = null;
            resetCountdown = 0;
            countdownDisplay.textContent = '⚔️ 战斗中！';
            countdownDisplay.style.color = '#6fcf97';

            sendData({
                type: 'game_reset',
                players: players,
                obstacles: obstacles
            });

            updateUI();
        }

        function startResetCountdown() {
            if (resetTimer) return;
            if (gameEnded) return;

            gameEnded = true;
            resetCountdown = 3;
            countdownDisplay.textContent = '⏳ ' + resetCountdown + 's';
            countdownDisplay.style.color = '#ff6b6b';

            resetTimer = setInterval(() => {
                resetCountdown--;
                if (resetCountdown > 0) {
                    countdownDisplay.textContent = '⏳ ' + resetCountdown + 's';
                } else {
                    clearInterval(resetTimer);
                    resetTimer = null;
                    resetGame();
                }
            }, 1000);
        }

        // ============================================================
        //  【核心】射击函数 - 本地立即显示子弹
        // ============================================================

        function shootBullet() {
            if (!localPlayer || !localPlayer.alive) return false;
            if (!gameRunning) return false;
            if (localPlayer.shootCooldown > 0) return false;

            const angle = localPlayer.angle;
            const bullet = {
                id: genId(),
                ownerId: myId,
                x: localPlayer.x + Math.cos(angle) * 22,
                y: localPlayer.y + Math.sin(angle) * 22,
                vx: Math.cos(angle) * 8.5,
                vy: Math.sin(angle) * 8.5,
                radius: 5,
                life: 65,
                damage: 1,
                // 标记是否已同步
                synced: false
            };

            // 【关键】本地立即添加子弹
            bullets.push(bullet);
            localPlayer.shootCooldown = 12;

            // 发送给主机同步
            sendData({
                type: 'bullet_spawn',
                bullet: bullet
            });

            // 调试日志
            console.log('🔫 射击! 子弹ID:', bullet.id, '本地子弹数:', bullets.length);

            return true;
        }

        // ============================================================
        //  更新逻辑
        // ============================================================

        function updateLocalPlayer() {
            if (!localPlayer || !localPlayer.alive || !isConnected) return;
            if (!gameRunning) return;

            const k = KEYMAP[0];
            let dx = 0,
                dy = 0;
            if (keys[k.up]) dy -= 1;
            if (keys[k.down]) dy += 1;
            if (keys[k.left]) dx -= 1;
            if (keys[k.right]) dx += 1;

            const angle = Math.atan2(mouseY - localPlayer.y, mouseX - localPlayer.x);
            localPlayer.angle = angle;

            if (dx !== 0 || dy !== 0) {
                const len = Math.hypot(dx, dy);
                const moveX = (dx / len) * localPlayer.speed;
                const moveY = (dy / len) * localPlayer.speed;

                let newX = localPlayer.x + moveX;
                let newY = localPlayer.y + moveY;
                newX = Math.max(localPlayer.radius, Math.min(800 - localPlayer.radius, newX));
                newY = Math.max(localPlayer.radius, Math.min(600 - localPlayer.radius, newY));

                let blockedX = false,
                    blockedY = false;
                for (let ob of obstacles) {
                    if (!ob.alive) continue;
                    if (rectCircleCollide(ob, { x: newX, y: localPlayer.y, radius: localPlayer.radius })) blockedX = true;
                    if (rectCircleCollide(ob, { x: localPlayer.x, y: newY, radius: localPlayer.radius })) blockedY = true;
                }
                if (!blockedX) localPlayer.x = newX;
                if (!blockedY) localPlayer.y = newY;
            }

            if (localPlayer.shootCooldown > 0) localPlayer.shootCooldown--;

            // 射击检测
            const shouldShoot = mousePressed || keys[k.fire];
            if (shouldShoot && localPlayer.shootCooldown === 0) {
                shootBullet();
                mousePressed = false;
            }

            sendData({
                type: 'player_update',
                player: {
                    id: myId,
                    x: localPlayer.x,
                    y: localPlayer.y,
                    angle: localPlayer.angle,
                    hp: localPlayer.hp,
                    alive: localPlayer.alive
                }
            });
        }

        // ----- 主机：更新子弹碰撞 -----
        function updateBullets() {
            if (!isHost) return;
            if (!gameRunning) return;

            const toRemove = [];

            for (let i = 0; i < bullets.length; i++) {
                const b = bullets[i];
                b.x += b.vx;
                b.y += b.vy;
                b.life--;

                // 边界/寿命检查
                if (b.x < 0 || b.x > 800 || b.y < 0 || b.y > 600 || b.life <= 0) {
                    toRemove.push(b.id);
                    continue;
                }

                let used = false;

                // 障碍物碰撞
                for (let ob of obstacles) {
                    if (!ob.alive) continue;
                    if (b.x > ob.x && b.x < ob.x + ob.w && b.y > ob.y && b.y < ob.y + ob.h) {
                        ob.hp--;
                        if (ob.hp <= 0) ob.alive = false;
                        sendData({ type: 'obstacle_damage', obstacleId: ob.id, hp: ob.hp });
                        used = true;
                        break;
                    }
                }
                if (used) {
                    toRemove.push(b.id);
                    continue;
                }

                // 玩家碰撞
                for (let p of Object.values(players)) {
                    if (!p.alive || p.id === b.ownerId) continue;
                    const dx = p.x - b.x;
                    const dy = p.y - b.y;
                    if (dx * dx + dy * dy < (p.radius + b.radius) * (p.radius + b.radius)) {
                        p.hp -= b.damage;
                        if (p.hp <= 0) {
                            p.alive = false;
                            p.hp = 0;
                        }
                        sendData({ type: 'player_hit', targetId: p.id, hp: p.hp });
                        used = true;
                        break;
                    }
                }
                if (used) {
                    toRemove.push(b.id);
                }
            }

            // 移除子弹并广播
            for (let id of toRemove) {
                bullets = bullets.filter(b => b.id !== id);
                sendData({ type: 'bullet_remove', bulletId: id });
            }

            // 检查胜利
            const alive = Object.values(players).filter(p => p.alive);
            if (alive.length <= 1 && gameRunning && !gameEnded) {
                gameRunning = false;
                winnerId = alive.length === 1 ? alive[0].id : null;
                sendData({ type: 'game_over', winnerId: winnerId });
                updateUI();
                startResetCountdown();
            }
        }

        // ============================================================
        //  网络通信
        // ============================================================

        function sendData(data) {
            if (conn && conn.open) {
                conn.send(JSON.stringify(data));
            }
        }

        function handlePeerMessage(data) {
            switch (data.type) {
                case 'player_info':
                    if (data.player && data.player.id !== myId) {
                        if (!players[data.player.id]) {
                            players[data.player.id] = createPlayer(
                                data.player.id,
                                data.player.x,
                                data.player.y,
                                data.player.name,
                                data.player.color
                            );
                        }
                        Object.assign(players[data.player.id], data.player);
                        updateUI();
                    }
                    break;

                case 'player_update':
                    if (data.player && data.player.id !== myId && players[data.player.id]) {
                        Object.assign(players[data.player.id], data.player);
                        updateUI();
                    }
                    break;

                case 'bullet_spawn':
                    // 【关键】收到子弹立即添加到本地
                    bullets.push(data.bullet);
                    // 调试日志
                    console.log('📨 收到子弹:', data.bullet.id, '来自:', data.bullet.ownerId);

                    // 如果是主机，转发给客户端（但不要转发回发送者）
                    if (isHost) {
                        // 转发给连接的客户端
                        const msg = JSON.stringify({
                            type: 'bullet_spawn',
                            bullet: data.bullet
                        });
                        if (conn && conn.open) {
                            conn.send(msg);
                        }
                    }
                    break;

                case 'bullet_remove':
                    bullets = bullets.filter(b => b.id !== data.bulletId);
                    // 主机转发移除消息
                    if (isHost) {
                        const msg = JSON.stringify({
                            type: 'bullet_remove',
                            bulletId: data.bulletId
                        });
                        if (conn && conn.open) {
                            conn.send(msg);
                        }
                    }
                    break;

                case 'player_hit':
                    if (players[data.targetId]) {
                        players[data.targetId].hp = data.hp;
                        if (data.hp <= 0) players[data.targetId].alive = false;
                    }
                    break;

                case 'game_over':
                    gameRunning = false;
                    winnerId = data.winnerId;
                    updateUI();
                    if (!isHost && !gameEnded) {
                        startResetCountdown();
                    }
                    break;

                case 'game_reset':
                    console.log('🔄 收到重置指令');
                    players = data.players || {};
                    obstacles = data.obstacles || [];
                    bullets = [];
                    gameRunning = true;
                    gameEnded = false;
                    winnerId = null;
                    resetCountdown = 0;
                    countdownDisplay.textContent = '⚔️ 战斗中！';
                    countdownDisplay.style.color = '#6fcf97';
                    if (myId && players[myId]) {
                        localPlayer = players[myId];
                    }
                    updateUI();
                    break;

                case 'obstacle_damage':
                    for (let ob of obstacles) {
                        if (ob.id === data.obstacleId) {
                            ob.hp = data.hp;
                            if (ob.hp <= 0) ob.alive = false;
                            break;
                        }
                    }
                    break;

                case 'sync_request':
                    if (isHost) {
                        sendData({
                            type: 'full_state',
                            players: players,
                            bullets: bullets,
                            obstacles: obstacles,
                            gameRunning: gameRunning,
                            winnerId: winnerId
                        });
                    }
                    break;

                case 'full_state':
                    if (!isHost) {
                        players = data.players || {};
                        bullets = data.bullets || [];
                        obstacles = data.obstacles || [];
                        gameRunning = data.gameRunning !== undefined ? data.gameRunning : true;
                        winnerId = data.winnerId || null;
                        if (myId && players[myId]) {
                            localPlayer = players[myId];
                        }
                        updateUI();
                    }
                    break;
            }
        }

        // ============================================================
        //  创建/加入房间
        // ============================================================

        function createRoom() {
            if (isConnected) disconnect();

            roomId = String(Math.floor(1000 + Math.random() * 9000));
            document.getElementById('roomInput').value = roomId;
            roomIdDisplay.textContent = '📋 房间号: ' + roomId;

            peer = new Peer(roomId, { debug: 0 });

            peer.on('open', (id) => {
                console.log('✅ 房间创建成功，ID:', id);
                initLocalGame();
                isHost = true;
                isConnected = true;
                statusDisplay.className = 'status waiting';
                statusDisplay.textContent = '🟡 等待加入...';
                countdownDisplay.textContent = '⏳ 等待玩家...';
                countdownDisplay.style.color = '#8bc9e6';
                updateUI();
                alert('✅ 房间创建成功！\n房间号: ' + roomId);
            });

            peer.on('connection', (incoming) => {
                console.log('📞 有人连接:', incoming.peer);
                conn = incoming;

                conn.on('open', () => {
                    console.log('✅ 连接已建立');
                    statusDisplay.className = 'status online';
                    statusDisplay.textContent = '🟢 已连接 (主机)';
                    countdownDisplay.textContent = '⚔️ 战斗中！';
                    countdownDisplay.style.color = '#6fcf97';

                    sendData({
                        type: 'player_info',
                        player: {
                            id: myId,
                            x: localPlayer.x,
                            y: localPlayer.y,
                            color: localPlayer.color,
                            name: localPlayer.name,
                            hp: localPlayer.hp,
                            alive: localPlayer.alive
                        }
                    });
                });

                conn.on('data', (data) => {
                    try { handlePeerMessage(JSON.parse(data)); } catch (e) { console.warn(e); }
                });

                conn.on('close', () => {
                    console.log('❌ 连接断开');
                    statusDisplay.className = 'status offline';
                    statusDisplay.textContent = '🔴 连接断开';
                    isConnected = false;
                    if (resetTimer) { clearInterval(resetTimer);
                        resetTimer = null; }
                });
            });

            peer.on('error', (err) => {
                console.error('Peer错误:', err);
                if (err.type === 'unavailable-id') {
                    alert('❌ 房间号已被占用，请重新创建');
                    disconnect();
                } else {
                    statusDisplay.className = 'status offline';
                    statusDisplay.textContent = '🔴 错误: ' + err.message;
                }
            });
        }

        function joinRoom(roomIdToJoin) {
            if (isConnected) disconnect();

            roomId = roomIdToJoin.trim();
            if (!roomId) { alert('请输入房间号'); return; }

            roomIdDisplay.textContent = '📋 加入房间: ' + roomId;

            peer = new Peer({ debug: 0 });

            peer.on('open', (id) => {
                console.log('✅ 本地ID:', id);
                initLocalGame();
                isHost = false;
                isConnected = true;
                statusDisplay.className = 'status connecting';
                statusDisplay.textContent = '🟡 连接中...';
                countdownDisplay.textContent = '⏳ 连接中...';
                countdownDisplay.style.color = '#f2c94c';

                conn = peer.connect(roomId);

                conn.on('open', () => {
                    console.log('✅ 连接已建立');
                    statusDisplay.className = 'status online';
                    statusDisplay.textContent = '🟢 已连接 (客户端)';
                    countdownDisplay.textContent = '⚔️ 战斗中！';
                    countdownDisplay.style.color = '#6fcf97';

                    sendData({
                        type: 'player_info',
                        player: {
                            id: myId,
                            x: localPlayer.x,
                            y: localPlayer.y,
                            color: localPlayer.color,
                            name: localPlayer.name,
                            hp: localPlayer.hp,
                            alive: localPlayer.alive
                        }
                    });
                    sendData({ type: 'sync_request' });
                });

                conn.on('data', (data) => {
                    try { handlePeerMessage(JSON.parse(data)); } catch (e) { console.warn(e); }
                });

                conn.on('close', () => {
                    console.log('❌ 连接断开');
                    statusDisplay.className = 'status offline';
                    statusDisplay.textContent = '🔴 连接断开';
                    isConnected = false;
                    if (resetTimer) { clearInterval(resetTimer);
                        resetTimer = null; }
                });
            });

            peer.on('error', (err) => {
                console.error('Peer错误:', err);
                if (err.type === 'peer-unavailable') {
                    alert('❌ 房间不存在，请检查房间号是否正确');
                } else {
                    alert('❌ 连接失败: ' + err.message);
                }
                statusDisplay.className = 'status offline';
                statusDisplay.textContent = '🔴 连接失败';
                isConnected = false;
            });
        }

        // ============================================================
        //  UI更新 & 绘图
        // ============================================================

        function updateUI() {
            const count = Object.keys(players).length;
            playerCountEl.textContent = count;
            bulletCountEl.textContent = bullets.length;

            if (!gameRunning && gameEnded) {
                if (winnerId !== null && players[winnerId]) {
                    winnerSpan.textContent = '🏆 ' + players[winnerId].name;
                } else {
                    winnerSpan.textContent = '💀 平局';
                }
            } else {
                winnerSpan.textContent = '⚡ 进行中';
            }
        }

        function draw() {
            ctx.clearRect(0, 0, 800, 600);

            // 背景网格
            ctx.strokeStyle = '#2a4a5a';
            ctx.lineWidth = 1;
            for (let i = 0; i < 800; i += 40) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, 600);
                ctx.strokeStyle = '#2a4a5a';
                ctx.stroke();
            }
            for (let i = 0; i < 600; i += 40) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(800, i);
                ctx.strokeStyle = '#2a4a5a';
                ctx.stroke();
            }

            // 障碍物
            for (let ob of obstacles) {
                if (!ob.alive) continue;
                const alpha = 0.5 + 0.5 * (ob.hp / ob.maxHp);
                ctx.fillStyle = `rgba(70, 120, 140, ${alpha})`;
                ctx.shadowColor = '#aaccdd';
                ctx.shadowBlur = 8;
                ctx.fillRect(ob.x, ob.y, ob.w, ob.h);
                ctx.shadowBlur = 0;
                ctx.strokeStyle = '#b8d8e8';
                ctx.lineWidth = 2;
                ctx.strokeRect(ob.x, ob.y, ob.w, ob.h);
                if (ob.hp > 0) {
                    ctx.fillStyle = '#c8e6f0';
                    ctx.font = '10px monospace';
                    ctx.fillText('🛡️'.repeat(ob.hp), ob.x + 4, ob.y + 14);
                }
            }

            // 【核心】绘制子弹 - 所有子弹都显示
            for (let b of bullets) {
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius || 5, 0, 2 * Math.PI);
                ctx.fillStyle = '#ffdd77';
                ctx.shadowColor = '#ffbb33';
                ctx.shadowBlur = 18;
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            // 玩家
            for (let id in players) {
                const p = players[id];
                if (!p.alive) {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 16, 0, 2 * Math.PI);
                    ctx.fillStyle = '#334455';
                    ctx.fill();
                    ctx.fillStyle = '#667788';
                    ctx.font = '20px sans-serif';
                    ctx.fillText('💀', p.x - 14, p.y + 8);
                    continue;
                }

                ctx.shadowColor = '#00000055';
                ctx.shadowBlur = 14;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 16, 0, 2 * Math.PI);
                ctx.fillStyle = p.color || COLORS[id % COLORS.length];
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2.5;
                ctx.stroke();

                ctx.shadowBlur = 0;
                const angle = p.angle || 0;
                const tipX = p.x + Math.cos(angle) * 26;
                const tipY = p.y + Math.sin(angle) * 26;
                ctx.beginPath();
                ctx.moveTo(p.x + Math.cos(angle) * 6, p.y + Math.sin(angle) * 6);
                ctx.lineTo(tipX, tipY);
                ctx.strokeStyle = '#1a1a2c';
                ctx.lineWidth = 5;
                ctx.stroke();
                ctx.strokeStyle = '#f0f0f0';
                ctx.lineWidth = 2.5;
                ctx.stroke();

                ctx.fillStyle = '#fff6d0';
                ctx.font = 'bold 15px monospace';
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#000';
                ctx.fillText('❤️'.repeat(Math.max(0, p.hp)), p.x - 18, p.y - 30);
                ctx.fillStyle = '#e0f0ff';
                ctx.font = 'bold 12px sans-serif';
                ctx.fillText(p.name || `玩家`, p.x - 20, p.y - 50);
                ctx.shadowBlur = 0;

                if (id === myId) {
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([4, 4]);
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 22, 0, 2 * Math.PI);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
            }

            // 鼠标准星
            if (localPlayer && localPlayer.alive) {
                ctx.beginPath();
                ctx.arc(mouseX, mouseY, 6, 0, 2 * Math.PI);
                ctx.fillStyle = '#ffdd88';
                ctx.shadowColor = '#ffaa33';
                ctx.shadowBlur = 20;
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.moveTo(mouseX - 14, mouseY);
                ctx.lineTo(mouseX + 14, mouseY);
                ctx.moveTo(mouseX, mouseY - 14);
                ctx.lineTo(mouseX, mouseY + 14);
                ctx.strokeStyle = '#ffe066';
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            // 游戏结束覆盖层
            if (!gameRunning && gameEnded) {
                ctx.fillStyle = 'rgba(0,0,0,0.4)';
                ctx.fillRect(0, 0, 800, 600);
                ctx.font = 'bold 44px sans-serif';
                ctx.fillStyle = '#ffe484';
                ctx.shadowColor = '#000000';
                ctx.shadowBlur = 20;

                let msg = '💥 平局';
                if (winnerId !== null && players[winnerId]) {
                    msg = `🏆 ${players[winnerId].name} 获胜！`;
                }
                if (resetCountdown > 0) {
                    msg += `  ⏳ ${resetCountdown}s`;
                }
                ctx.fillText(msg, 150, 320);
                ctx.shadowBlur = 0;
            }

            updateUI();
        }

        // ============================================================
        //  主循环
        // ============================================================

        function gameLoop() {
            if (isConnected && localPlayer) {
                updateLocalPlayer();
                if (isHost) {
                    updateBullets();
                }
            }
            draw();
            requestAnimationFrame(gameLoop);
        }

        // ============================================================
        //  连接管理
        // ============================================================

        function disconnect() {
            if (resetTimer) { clearInterval(resetTimer);
                resetTimer = null; }
            if (conn) { try { conn.close(); } catch (e) {} }
            if (peer) { try { peer.destroy(); } catch (e) {} }
            conn = null;
            peer = null;
            isConnected = false;
            isHost = false;
            players = {};
            bullets = [];
            localPlayer = null;
            myId = null;
            roomId = '';
            gameEnded = false;
            roomIdDisplay.textContent = '📋 房间号: 无';
            statusDisplay.className = 'status offline';
            statusDisplay.textContent = '⚪ 未连接';
            resetCountdown = 0;
            countdownDisplay.textContent = '⏳ 等待...';
            countdownDisplay.style.color = '#8bc9e6';
            updateUI();
        }

        // ============================================================
        //  事件绑定
        // ============================================================

        document.getElementById('hostBtn').addEventListener('click', createRoom);
        document.getElementById('joinBtn').addEventListener('click', () => {
            const id = document.getElementById('roomInput').value.trim();
            if (id) { joinRoom(id); } else { alert('请输入房间号'); }
        });
        document.getElementById('disconnectBtn').addEventListener('click', disconnect);

        document.getElementById('roomInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { document.getElementById('joinBtn').click(); }
        });

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            mouseX = Math.min(800, Math.max(0, (e.clientX - rect.left) * scaleX));
            mouseY = Math.min(600, Math.max(0, (e.clientY - rect.top) * scaleY));
        });

        canvas.addEventListener('mousedown', (e) => {
            if (e.button === 0) { e.preventDefault();
                mousePressed = true; }
        });

        canvas.addEventListener('mouseup', (e) => {
            if (e.button === 0) e.preventDefault();
        });

        canvas.addEventListener('contextmenu', (e) => e.preventDefault());

        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            keys[key] = true;
            if (['w', 'a', 's', 'd', ' '].includes(key) || e.key === ' ') {
                e.preventDefault();
            }
        });

        document.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            keys[key] = false;
            if (['w', 'a', 's', 'd', ' '].includes(key) || e.key === ' ') {
                e.preventDefault();
            }
        });

        window.addEventListener('blur', () => {
            for (let k in keys) keys[k] = false;
            mousePressed = false;
        });

        console.log('🎮 联机枪战');
        console.log('📋 核心修复: 本地射击后子弹立即显示在画布上');
        console.log('💡 按空格或鼠标左键射击，子弹会立即飞出');

        gameLoop();
    </script>
</body>
</html>
